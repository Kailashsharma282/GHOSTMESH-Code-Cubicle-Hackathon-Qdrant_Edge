version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Central Qdrant Server (Shared Cloud Memory Tier)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ghostmesh-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ghostmesh-network

  # ----------------------------------------------------------------------------
  # 2. GhostMesh Backend API & Edge Node Orchestrator
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ghostmesh-api
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8088
      - LOG_LEVEL=INFO
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - CLOUD_COLLECTION=${CLOUD_COLLECTION:-ghostmesh_memories}
      - EDGE_DATA_DIR=/app/data
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RECONCILIATION_THRESHOLD=0.78
      - DUPLICATE_THRESHOLD=0.93
      - CORS_ORIGINS=*
    volumes:
      - ghostmesh_edge_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ghostmesh-network

  # ----------------------------------------------------------------------------
  # 3. GhostMesh Web Console (React 19 + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ghostmesh-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ghostmesh-network

volumes:
  qdrant_data:
    name: ghostmesh_qdrant_data
  ghostmesh_edge_data:
    name: ghostmesh_edge_data

networks:
  ghostmesh-network:
    name: ghostmesh-network
    driver: bridge
