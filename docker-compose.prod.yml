version: '3.8'

# ==============================================================================
# GHOSTMESH HARDENED PRODUCTION COMPOSE SPECIFICATION
# ==============================================================================

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: ghostmesh-prod-qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mesh_backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ghostmesh-prod-api
    restart: always
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8088
      - QDRANT_URL=http://qdrant:6333
      - EDGE_DATA_DIR=/app/data
    volumes:
      - edge_storage:/app/data:z
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - mesh_backend
      - mesh_frontend

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ghostmesh-prod-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mesh_frontend

volumes:
  qdrant_storage:
    name: ghostmesh_prod_qdrant_storage
  edge_storage:
    name: ghostmesh_prod_edge_storage

networks:
  mesh_backend:
    internal: true
  mesh_frontend:
    driver: bridge
